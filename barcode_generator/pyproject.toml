[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Keep name/description/license/authors aligned with
# classroom_library_label_maker.metadata (Python single source of truth).
name = "classroom-library-barcode-generator"
description = "Generate EAN-13 barcode PNGs for classroom library books from JSON input."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Classroom Library Label Maker contributors" },
]
dynamic = ["version"]
dependencies = [
    "python-barcode>=0.15.1",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9.0",
    "mypy>=1.14",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
barcode-generator = "classroom_library_label_maker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Keep name/description/license/authors aligned with
# classroom_library_label_maker.metadata (Python single source of truth).
name = "classroom-library-barcode-generator"
description = "Generate EAN-13 barcode PNGs for classroom library books from JSON input."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Classroom Library Label Maker contributors" },
]
dynamic = ["version"]
# Runtime-only: needed to generate EAN-13 PNG barcodes.
# Dev/test/packaging tools live under [project.optional-dependencies].
dependencies = [
    "python-barcode>=0.15.1",
    "Pillow>=11.0.0",  # required for ImageWriter PNG output (python-barcode[images])
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9.0",
    "mypy>=1.14",
    "pre-commit>=4.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
barcode-generator = "classroom_library_label_maker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# Default discovery uses test_*.py; tests/benchmarks/benchmark_*.py is excluded
# so engineering timings never run (or fail) in normal / CI pytest invocations.

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]

# Ruff lives in .ruff.toml (formatting, import sorting, lint).
